[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note"
version = "0.5.0"
description = "Sticky notes and todos that stay in your terminal, kept in a single SQLite file"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Note Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "platformdirs>=4.2.0"
]

[project.scripts]
note = "note.cli.app:app"
notes = "note.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/note"]
